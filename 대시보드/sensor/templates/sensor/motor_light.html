<div class="motor-light {% if state == 'BLENDING_'|add:key %}active{% endif %}">
    {{ name }}
</div>
<style>
/* CSS for motor lights */
.motor-light {
    display: inline-block;
    padding: 8px 15px;
    margin: 5px;
    border-radius: 8px;
    background-color: #f0f0f0; /* Off */
    color: #333;
    font-weight: bold;
    border: 1px solid #ddd;
    transition: all 0.3s;
}
.motor-light.active {
    background-color: #28a745; /* On (Green) */
    color: white;
    border-color: #1e7e34;
    box-shadow: 0 0 8px rgba(40, 167, 69, 0.5);
    transform: scale(1.05);
}
</style>
